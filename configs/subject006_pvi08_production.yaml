# Subject006 production configuration.
# US120 is identified by an exact match between the historical HDF5 finite-image
# mask and the b045/US120 mesh-to-image mapping.

pvi_solver_root: "../../Peripheral-Vascular-Impedance-Imaging/python_port/pvi_solver"
mesh_fwd_h5: "../data/ring_meshes/subject006_US120/ring_US120_fwd.h5"
mesh_inv_h5: "../data/ring_meshes/subject006_US120/ring_US120_inv.h5"
mappings_h5: "../data/ring_meshes/subject006_US120/ring_US120_mappings_40.h5"

num_elecs: 8
# SCIOSPEC stores +0.01 A; the MATLAB PVI pipeline passes its negative.
stim_current: -0.01
stim_pattern: [0, 3]
meas_pattern: [0, 2]

img_size: 40
imaging_mode: differential
lambda_lm: 0.0
hyper_pvi: 0.0005
use_laplace: true
lm_step_size: 1.0
connectivity: node

n_samples: 500
noise_scale: 0.005
seed: 0
phantom_mode: perturbation

iterations: 10
channels: [250, 250, 250]
split: 0.8
learning_rate: 0.002
batch_size: 10
max_epochs: 10000
patience: 200
shared_model: false

model_name: gcnm_subject006_US120
samples_dir: samples/gcnm_subject006_US120
models_dir: models
data_dir: data

filter_cutoff_hz: 5.0
filter_pass: low
hp_lp_window: 100
