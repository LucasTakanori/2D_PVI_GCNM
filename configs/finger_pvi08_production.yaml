# Production-matched PVI export (scionova-like preprocessing + 40×40 images)

pvi_solver_root: "../../Peripheral-Vascular-Impedance-Imaging/python_port/pvi_solver"

mesh_fwd_h5: "../../Peripheral-Vascular-Impedance-Imaging/python_port/pvi_solver/_data/_mesh08_r64/tank2d_mdl_64_refined.h5"
mesh_inv_h5: "../../Peripheral-Vascular-Impedance-Imaging/python_port/pvi_solver/_data/_mesh08_r64/tank2d_mdl_64.h5"
# Build with: bash scripts/build_m2i_40.sh
mappings_h5: "../../Peripheral-Vascular-Impedance-Imaging/python_port/pvi_solver/_data/_mesh08_r64/tank2d_mdl_64_mappings_40.h5"

num_elecs: 8
stim_current: 0.001
stim_pattern: [0, 3]
meas_pattern: [0, 2]   # production PIPELINECONFIGS strict

img_size: 40
imaging_mode: differential
lambda_lm: 0.0
hyper_pvi: 0.0005      # production pvi_inv_solve lambda = 5e-4
use_laplace: true
lm_step_size: 1.0
connectivity: node

n_samples: 500
noise_scale: 0.005
seed: 0
phantom_mode: perturbation

iterations: 10
channels: [250, 250, 250]
split: 0.8
learning_rate: 0.002
batch_size: 10
max_epochs: 10000
patience: 200
shared_model: false

model_name: gcnm_pvi08_prod
samples_dir: samples/gcnm_pvi08_prod
models_dir: models
data_dir: data

filter_cutoff_hz: 5.0
filter_pass: low
hp_lp_window: 100
